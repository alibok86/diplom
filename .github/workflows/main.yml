name: CI/CD Test App

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Срабатывает при создании тегов v1.0.0 и т.д.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker image
        working-directory: main/nginx 
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/test-nginx-app:${{ steps.vars.outputs.TAG }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/test-nginx-app:${{ steps.vars.outputs.TAG }}

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/k8s-deploy@v5
        with:
          manifests: |
            main/nginx/app_deploy.yaml
          images: |
            ${{ secrets.DOCKER_USERNAME }}/test-nginx-app:${{ steps.vars.outputs.TAG }}